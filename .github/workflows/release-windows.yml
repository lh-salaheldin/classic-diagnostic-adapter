name: Release Windows Binary

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release_windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Perl (required for vendored OpenSSL build)
        uses: shogo82148/actions-setup-perl@v1

      - name: Build release binary
        run: cargo build --locked --release --package opensovd-cda --no-default-features --features openssl-vendored

      - name: Create GitHub Release and upload binary
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/opensovd-cda.exe
          generate_release_notes: true
