[package]
name = "cda-web-ui"
version = "0.1.0"
edition.workspace = true
publish = false
description = "Embeds the cda-ui web frontend into the CDA binary"
homepage.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
cda-sovd = { workspace = true }
aide = { workspace = true, features = ["axum"] }
axum = { workspace = true, features = ["http1"] }
mime_guess = "2"
rust-embed = "8"
